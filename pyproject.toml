[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-dreaming"
version = "0.3.12"
description = "Background memory consolidation plugin for Hermes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.13",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/alejandroiglesias/hermes-dreaming"
Repository = "https://github.com/alejandroiglesias/hermes-dreaming"
Documentation = "https://alejandroiglesias.github.io/hermes-dreaming/"
Changelog = "https://github.com/alejandroiglesias/hermes-dreaming/blob/main/CHANGELOG.md"

[project.entry-points."hermes_agent.plugins"]
hermes-dreaming = "hermes_dreaming"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_dreaming*"]

[tool.setuptools.package-data]
hermes_dreaming = ["plugin.yaml", "prompts/*.md", "prompts/*.txt"]
